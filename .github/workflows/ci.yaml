name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CABAL_DIR: ${{ github.workspace }}/.cabal

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://shinzui.cachix.org
            extra-trusted-public-keys = shinzui.cachix.org-1:QEmAoJrA9WwLP0uxfDgktLi2BRrcvQQWdz8NzcMg4/E=

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cabal
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc9.12.4-${{ hashFiles('cabal.project', 'cohort/*.project', '**/*.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-ghc9.12.4-

      - name: Update Hackage index
        run: nix develop --command cabal update

      - name: Verify
        run: nix develop --command just verify

      - name: Check Nix flake
        run: nix flake check
